    gap: 10px;
    font-family: 'Share Tech Mono', monospace;
    color: var(--neon);
    font-weight: 600;
  }

  .navlinks {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  /* Nav sits back by default. whoami/ is the one green item, which gives the
     header a single focal point instead of four competing ones. */
  .navlinks a {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    text-decoration: none;
    color: #9fb3ad;
    padding: 8px 10px;
    border-radius: 8px;
    transition: all 0.25s cubic-bezier(.2, .9, .2, 1);
    -webkit-tap-highlight-color: transparent;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
  }

  .navlinks a#nav-whoami { color: var(--neon); }
  .navlinks a#nav-whoami .nav-icon { color: var(--neon); }

  .nav-icon {
    width: 18px;
    height: 18px;
    display: inline-block;
    flex: 0 0 18px;
    color: currentColor;
    transition: all 0.25s ease;
  }

  .navlinks a svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    transition: stroke 0.25s ease, filter 0.25s ease;
  }

  /* Hover state: icon and text both glow */
  .navlinks a:hover, .navlinks a:focus {
    color: var(--accent);
    transform: translateY(-3px) scale(1.08);
    text-shadow: 0 0 6px var(--accent), 0 0 12px var(--accent);
    filter: drop-shadow(0 0 8px var(--accent));
  }

  .navlinks a:hover .nav-icon svg {
    stroke: var(--accent);
    filter: drop-shadow(0 0 6px var(--accent));
  }

  /* Active link */
  .navlinks a.active {
    color: var(--accent);
  }
